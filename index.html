<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


    <div class="container">
        <div class="title">
            <p><span>SPLI</span><span>TTER</span></p>
        </div>

        <div class="calculator">
            <div class="tip-calculating">
                <div class="bill">
                    <label for="bill-amount">Bill</label>
                    <input type="number" id="bill-amount" class="form-control">
                </div>
                <div class="tip-percentage">
                    <button type="button" class="btn">5%</button>
                    <button type="button" class="btn">10%</button>
                    <button type="button" class="btn">15%</button>
                    <button type="button" class="btn">25%</button>
                    <button type="button" class="btn">50%</button>
                    <input type="number" placeholder="custom">
                </div>
                <inp class="people-number">
                    <label for="number-of-people">Number of people</label>
                    <input type="number" id="number-of-people">
                </div>
            </div>
        </div>
    </div>





    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
